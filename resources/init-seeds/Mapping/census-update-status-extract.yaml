resourceType: Mapping
id: census-update-status-extract
type: FHIRPath
body:
  "{% assign %}":
    - encounterId: "{{ %QuestionnaireResponse.answers('encounter-id') }}"
    - status: "{{ %QuestionnaireResponse.answers('status').code }}"

  resourceType: Bundle
  type: transaction
  entry:
    - request:
        method: PATCH
        url: "{{ '/Encounter/' + %encounterId }}"
      resource:
        status: "{{ %status }}"