resourceType: Mapping
id: census-update-status-extract
type: FHIRPath
body:
  "{% assign %}":
    - encounterId: "{{ %QuestionnaireResponse.answers('encounter-id') }}"
    - newStatus: "{{ %QuestionnaireResponse.answers('new-status') }}"

  resourceType: Bundle
  type: transaction
  entry:
    - request:
        method: PATCH
        url: "/Encounter/{{ %encounterId }}"
      resource:
        status: "{{ %newStatus.code }}"
