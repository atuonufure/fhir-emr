id: census-patient-add
resourceType: Questionnaire
name: census-patient-add
title: Add Patient to Census
status: active
mapping:
  - reference: urn:uuid:Mapping:census-patient-add-extract
launchContext:
  - name:
      code: Patient
    type:
      - Patient
  - name:
      code: Author
    type:
      - PractitionerRole
      - Practitioner
      - Patient
      - Organization
item:
  - text: PatientId
    type: string
    linkId: patientId
    hidden: true
    initialExpression:
      language: text/fhirpath
      expression: "%Patient.id"
  - text: Patient name
    type: string
    linkId: patient-name
    required: true
    initialExpression:
      language: text/fhirpath
      expression: "%Patient.name.first().given.first() + ' ' + %Patient.name.first().family"
  - text: Birth date
    type: date
    linkId: birth-date
    required: true
    initialExpression:
      language: text/fhirpath
      expression: "%Patient.birthDate"
  - text: Provider
    type: reference
    referenceResource:
      - PractitionerRole
    required: true
    linkId: practitioner-role
    answerExpression:
      language: application/x-fhir-query
      expression: "PractitionerRole?_assoc=practitioner"
    choiceColumn:
      - forDisplay: true
        path: >-
          practitioner.resource.name.given.first() + ' ' +
          practitioner.resource.name.family
  - text: Type of Visit
    type: choice
    linkId: visit-type
    required: true
    repeats: false
    answerOption:
      - valueCoding:
          system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
          code: consultation
          display: The first appointment
      - valueCoding:
          system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
          code: follow-up
          display: A follow up visit

meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
url: https://aidbox.emr.beda.software/fhir/Questionnaire/census-patient-add
