id: add-patient-to-census
resourceType: Questionnaire
name: add-patient-to-census
title: Add Patient to Census
status: active
mapping:
  - reference: urn:uuid:Mapping:add-patient-to-census-extract
item:
  - text: Patient name
    type: reference
    referenceResource:
      - Patient
    required: true
    linkId: patient
    answerExpression:
      language: application/x-fhir-query
      expression: "Patient?_sort=-_lastUpdated"
    choiceColumn:
      - forDisplay: true
        path: "name.given.first() + ' ' + name.family"
  - text: Birth date
    type: date
    linkId: birth-date
    initialExpression:
      language: text/fhirpath
      expression: "%QuestionnaireResponse.item.where(linkId='patient').answer.value.resolve().birthDate"
  - text: Provider
    type: reference
    referenceResource:
      - PractitionerRole
    required: true
    linkId: practitioner-role
    answerExpression:
      language: application/x-fhir-query
      expression: "PractitionerRole?_assoc=practitioner"
    choiceColumn:
      - forDisplay: true
        path: >-
          practitioner.resource.name.given.first() + ' ' +
          practitioner.resource.name.family + ' - ' + specialty.first().coding.display
  - text: Type of Visit
    type: choice
    linkId: type-of-visit
    required: true
    repeats: false
    answerOption:
      - valueCoding:
          system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
          code: consultation
          display: The first appointment
      - valueCoding:
          system: http://fhir.org/guides/argonaut-scheduling/CodeSystem/visit-type
          code: follow-up
          display: A follow up visit
meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
url: https://aidbox.emr.beda.software/fhir/Questionnaire/add-patient-to-census