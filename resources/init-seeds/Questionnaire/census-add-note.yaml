id: census-add-note
resourceType: Questionnaire
name: census-add-note
title: Add Census Note
status: active
mapping:
  - reference: urn:uuid:Mapping:census-add-note-extract
launchContext:
  - name:
      code: CurrentEncounter
    type:
      - Encounter
    description: The census encounter to add a note to
  - name:
      code: Author
    type:
      - Practitioner
item:
  - text: Encounter ID
    type: string
    linkId: encounter-id
    hidden: true
    initialExpression:
      language: text/fhirpath
      expression: "%CurrentEncounter.id"
  - text: Patient Reference
    type: string
    linkId: patient-reference
    hidden: true
    initialExpression:
      language: text/fhirpath
      expression: "%CurrentEncounter.subject.reference"
  - text: Note
    type: text
    linkId: note-text
    required: true

meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
url: https://aidbox.emr.beda.software/fhir/Questionnaire/census-add-note
